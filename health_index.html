<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Health and Wellness Calculator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f8;
    color:#17212b;
}

.container{
    max-width:760px;
    margin:auto;
    padding:18px 14px 28px;
}

.card{
    background:#fff;
    border:1px solid #dfe8ef;
    border-radius:28px;
    padding:28px;
    box-shadow:0 8px 28px rgba(31,95,139,.10);
}

.back{
    display:flex;
    width:100%;
    align-items:center;
    justify-content:center;
    padding:13px 16px;
    margin-bottom:14px;
    border:1px solid #cbd7ff;
    border-radius:12px;
    background:#eef3ff;
    color:#315efb;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
}

.back:hover{
    background:#e5ecff;
}

.hero{
    background:#1f5f8b;
    border-radius:28px;
    padding:34px 28px 30px;
    margin-bottom:18px;
    border:1px solid #e2e9ee;
    box-shadow:0 8px 28px rgba(31,95,139,.08);
}

.hero-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.hero-icon{
    width:78px;
    height:78px;
    flex:0 0 78px;
    border-radius:16px;
    background:#f7f8f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.hero-copy{
    min-width:0;
}

h1{
    margin:0;
    color:#fff;
    font-size:42px;
    line-height:1.08;
    font-weight:800;
    letter-spacing:.2px;
}

.subtitle{
    text-align:center;
    color:#e5f1f7;
    margin:22px auto 0;
    font-size:19px;
    line-height:1.35;
    max-width:600px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    background:#f8fbfd;
    color:#1f5f8b;
    border:1px solid #d9e6ee;
    padding:17px 18px;
    border-radius:15px;
    transition:.15s ease;
}

.menu a:hover{
    background:#eef6fa;
    border-color:#b9d2df;
    transform:translateY(-1px);
}

.icon{
    width:48px;
    height:48px;
    flex:0 0 48px;
    border-radius:12px;
    background:#e8f2f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.text{
    min-width:0;
}

.title{
    display:block;
    font-size:18px;
    font-weight:800;
    color:#1f5f8b;
    margin-bottom:4px;
}

.desc{
    display:block;
    font-size:13px;
    line-height:1.4;
    color:#687783;
}

.footer{
    text-align:center;
    color:#687783;
    font-size:12px;
    margin-top:22px;
}

@media(max-width:600px){
    .container{padding:12px 10px 22px}
    .card{padding:18px;border-radius:22px}
    .hero{padding:28px 16px 24px;border-radius:22px}
    .hero-top{gap:12px}
    .hero-icon{
        width:58px;
        height:58px;
        flex-basis:58px;
        font-size:34px;
    }
    h1{font-size:30px}
    .subtitle{font-size:15px;margin-top:16px}
    .title{font-size:17px}
    .desc{font-size:12px}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<a href="index.html" class="back">← Back</a>

<div class="hero">
    <div class="hero-top">
        <div class="hero-icon">🩺</div>
        <div class="hero-copy">
            <h1>Health and Wellness Calculator</h1>
        </div>
    </div>

    <p class="subtitle">
        Useful calculators for health, wellness and vital signs
    </p>
</div>

<div class="menu">

<a href="blood-pressure-calculator.html">
    <div class="icon">🩸</div>
    <div class="text">
        <span class="title">Blood Pressure Calculator</span>
        <span class="desc">Check blood pressure and heart rate with a colour-coded result</span>
    </div>
</a>

<!-- Add future health calculators here -->

</div>

<div class="footer">
    Calculator Hub
</div>

</div>

</div>

</body>
</html>
