<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electricity Calculators</title>
<style>
*{box-sizing:border-box}
:root{--navy:#123b57;--blue:#1f668f;--blue2:#2d7ea9;--sky:#eaf5fa;--ink:#15232e;--muted:#71808a;--line:#d9e4ea}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#e9f1f5 0,#f7f9fa 45%,#eef3f6 100%)}
.wrap{width:min(100% - 28px,760px);margin:auto;padding:20px 0 40px}
.card{background:transparent;border:0;border-radius:0;padding:0;margin:0}
.top-nav{display:flex;margin:0 0 14px;animation:fadeDown .5s ease both}
.top-back{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;padding:11px 15px;border:1px solid #cbdce6;border-radius:12px;background:#f8fbfd;color:var(--blue);font-size:14px;font-weight:800;text-decoration:none;transition:.22s ease}
.top-back:hover{background:var(--sky);border-color:#b8d2df;transform:translateY(-2px);box-shadow:0 7px 16px rgba(31,95,139,.08)}
.hero{position:relative;overflow:hidden;border-radius:25px;padding:30px 24px;margin-bottom:20px;color:#fff;background:radial-gradient(circle at 90% 15%,rgba(255,255,255,.18),transparent 25%),linear-gradient(125deg,var(--navy),var(--blue) 58%,var(--blue2));box-shadow:0 16px 35px rgba(31,95,139,.20);animation:heroIn .65s cubic-bezier(.2,.8,.2,1) both}
.hero:before{content:"";position:absolute;width:150px;height:150px;left:-80px;top:-90px;border-radius:50%;border:25px solid rgba(255,255,255,.055)}
.hero:after{content:"";position:absolute;width:260px;height:260px;right:-105px;bottom:-155px;border-radius:50%;border:42px solid rgba(255,255,255,.055)}
.title-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:13px}
.logo{width:52px;height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);font-size:27px;animation:iconPop .7s .12s ease both}
h1{margin:0;color:#fff;font-size:31px;line-height:1.1;font-weight:900;letter-spacing:-.7px}
.sub{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.84);font-size:13px;line-height:1.5;margin:10px auto 0;max-width:500px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:2px}
.menu a{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:13px;
  min-height:118px;
  padding:15px;
  text-decoration:none;
  color:var(--ink);
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  opacity:0;
  animation:tileIn .55s cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.menu a:nth-child(1){animation-delay:.08s}\n.menu a:nth-child(2){animation-delay:.15s}
.menu a:before{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:-55px;
  top:-55px;
  border-radius:50%;
  background:var(--sky);
  transition:transform .3s ease;
}
.menu a:hover{
  transform:translateY(-5px);
  border-color:#b9d3df;
  box-shadow:0 17px 30px rgba(31,95,139,.12);
}
.menu a:hover:before{
  transform:scale(1.7);
}
.menu a:active{transform:translateY(-1px)}
.menu-icon{
  position:relative;z-index:1;
  width:42px;height:42px;flex:0 0 42px;
  border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:var(--sky);border:1px solid #d6e7ee;
  font-size:21px;transition:transform .25s ease;
}
.menu a:hover .menu-icon{transform:scale(1.06) rotate(-2deg)}
.menu-text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
  position:relative;
  z-index:1;
  min-width:0;
  padding-right:28px;
}
.menu a:after{
  content:"↗";
  position:absolute;
  right:15px;
  bottom:15px;
  z-index:2;
  width:29px;
  height:29px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f6f8;
  color:var(--blue);
  font-size:15px;
  font-weight:900;
  transition:transform .22s ease,background .22s ease;
}
.menu a:hover:after{
  transform:translate(2px,-2px);
  background:#dcecf3;
}
.menu-title{color:var(--navy)}
.menu-desc{font-size:11px;font-weight:600;color:var(--muted)}
.note-card{margin-top:17px;padding:15px 17px;background:#f4f9fb;border:1px solid #d8e7ed;border-radius:15px;animation:tileIn .55s .22s cubic-bezier(.2,.8,.2,1) both}
.note{color:#687983;font-size:11px;line-height:1.5;text-align:center}
.note b{color:var(--navy)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0;transform:translateY(-12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes iconPop{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:520px){
  .wrap{width:min(100% - 18px,700px);padding:12px 0 25px}
  .hero{padding:24px 15px;border-radius:21px}
  .title-row{gap:10px}
  .logo{width:45px;height:45px;flex-basis:45px;border-radius:14px;font-size:23px}
  h1{font-size:25px}.sub{font-size:12px}
  .menu{grid-template-columns:1fr;gap:10px}
  .menu a{min-height:96px;flex-direction:row;align-items:center;padding:15px}
  .menu-icon{width:45px;height:45px;flex-basis:45px;font-size:23px}
}.hero{padding:24px 15px;border-radius:21px}.title-row{gap:10px}.logo{width:45px;height:45px;flex-basis:45px;border-radius:14px;font-size:23px}h1{font-size:25px}.sub{font-size:12px}.menu a{min-height:70px;padding:14px}.menu-icon{width:42px;height:42px;flex-basis:42px;font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top-nav">
      <a class="top-back" href="index.html">← Back</a>
    </div>

    <div class="hero">
      <div class="title-row">
        <div class="logo" aria-hidden="true">⚡</div>
        <h1>Electricity Calculators</h1>
      </div>
      <div class="sub">Choose an electricity calculator.</div>
    </div>

    <div class="menu">
      <a href="cesc_domestic_electricity_bill_calculator.html">
        <div class="menu-icon" aria-hidden="true">🔌</div>
        <div class="menu-text">
          <div class="menu-title">CESC Electricity Bill Calculator</div>
          <div class="menu-desc">Estimate your CESC domestic electricity bill</div>
        </div>
      </a>

      <a href="universal_electricity_consumption_calculator.html">
        <div class="menu-icon" aria-hidden="true">⚡</div>
        <div class="menu-text">
          <div class="menu-title">Electrical Appliance Unit Calculator</div>
          <div class="menu-desc">Calculate electricity consumption of appliances</div>
        </div>
      </a>

    </div>

    <div class="note-card">
      <div class="note"><b>Note:</b> Select a calculator above.</div>
    </div>
  </div>
</div>
</body>
</html>
